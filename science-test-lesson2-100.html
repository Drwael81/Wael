ondenses on cold surface."],["Choose - Below Zero","Temperature of <u>water vapour in air drops below 0°C</u>, result is:","Frost formation (deposition)|Rain only|Fog only|Boiling","Vapour → ice directly below 0°C is deposition frost."],["Choose - Ice in Air","A piece of <u>ice left in open air</u> at room temperature will:","Melt to water|Freeze more|Deposition|Sublime only to gas","Gains heat from air and melts."],["Choose - Dry Ice","Leaving <u>dry ice (solid CO2)</u> in open place results in:","Sublimation to CO2 gas|Melting to liquid CO2|Freezing|Condensation","Dry ice sublimes to CO2 gas directly."],["Complete - Change","Matter changes from one state to another by <u>gaining or losing</u>:","Thermal energy|Light only|Sound|Electric charge","State changes need thermal energy transfer."],["Complete - Reverse","<u>Evaporation is the reverse</u> of:","Condensation|Freezing|Melting|Deposition","Evaporation ↔ condensation are opposite."],["Complete - Reverse 2","<u>Sublimation is the reverse</u> of:","Deposition|Melting|Freezing|Condensation","Sublimation ↔ deposition are opposite."],["Complete - Frost Definition","Direct transformation from <u>gaseous to solid</u> is called deposition as occurs in formation of:","Frost|Rain|Boiling water|Steam","Frost is classic deposition example."],["Complete - Fog","Loss of thermal energy by water vapour in air leads to condensation in form of:","Fog|Boiling|Melting|Sublimation","Fog is condensed vapour near ground."],["Complete - Surface vs All","Process of <u>[blank]</u> occurs only for molecules at surface of water while boiling occurs in all parts:","Evaporation|Condensation|Freezing|Deposition","Evaporation is surface-only, boiling is bulk."],["Complete - Boiling Point Forces","At boiling point molecules <u>overcome</u>:","Forces of attraction between their molecules|Nuclear forces|Gravitational forces only|Magnetic forces","Boiling overcomes intermolecular attraction forces."],["Complete - Humidity Effect","Evaporation rate <u>decreases with increase</u> in:","Humidity|Temperature|Surface area|Air speed","High humidity means air already saturated, slows evaporation."],["Complete - Energy Exchange","Condensation <u>releases</u> thermal energy, while melting:","Absorbs thermal energy|Releases more|Destroys energy|Has no energy change","Condensation exothermic, melting endothermic."],["Complete - Chart","Water vapour → Ice directly via <u>arrow in chart</u> represents:","Deposition (or condensation + freezing if via liquid)|Only evaporation|Only melting|Only boiling","Vapour to ice can be direct deposition."],["Complete - Boiling Temp","Boiling point of <u>pure water at normal pressure</u> is:","100°C|0°C|50°C|150°C","Standard boiling point is 100°C."],["Complete - Melting Temp","Melting point of <u>ice at normal pressure</u> is:","0°C|100°C|-10°C|10°C","Ice melts at 0°C at normal pressure."],["Complete - Rule","Boiling point decreases by <u>1°C for every 300m</u> above:","Sea level|10 m|100 m|50 m","Standard altitude rule."],["Complete - Pressure Effect","When atmospheric pressure <u>decreases</u>, boiling point:","Decreases|Increases|Remains 100°C|Becomes 0°C","Lower pressure makes boiling easier, lower BP."],["Complete - Impurity Effect","When <u>180g glucose dissolved</u> in 1L water, boiling point <u>increases</u> and freezing point:","Decreases|Increases|Remains same|Becomes 100°C","Impurities raise BP, lower FP."],["T/F - Polar Ice","Water freezes in polar regions as result of <u>gaining thermal energy</u>.","False - losing thermal energy|True|False - gaining light|True - gaining energy","Correction: Freezing occurs by losing thermal energy."],["T/F - Dry Ice Formation","Conversion of carbon dioxide gas into dry ice is <u>sublimation</u>.","False - deposition|True|False - evaporation|True - condensation","Gas to solid is deposition, not sublimation."],["T/F - Fog Dew","Fog and dew are produced by <u>deposition</u>.","False - condensation|True|False - sublimation|True - deposition","Fog and dew are liquid, so condensation not deposition."],["T/F - Sublimation Energy","In <u>sublimation</u> substance loses thermal energy.","False - gains thermal energy|True|False - loses light|True - gains cold","Sublimation needs heat gain to break bonds."],["T/F - Deposition Particles","Deposition occurs because particles <u>lose thermal energy and come closer</u>.","True|False - gain energy|False - stay same|False - disappear","Losing energy brings particles together to form solid."],["T/F - Air Currents","Rate of evaporation <u>increases when speed of air currents</u> above surface increases.","True|False - decreases|False - remains|False - becomes zero","Air currents remove vapour, increasing evaporation."],["T/F - Surface Area","Increasing <u>surface of liquid increases</u> evaporation rate.","True|False - decreases it|False - no effect|False - stops it","Larger surface exposes more molecules."],["T/F - Humidity Rate","Increase in humidity leads to <u>increase in rate of evaporation</u>.","False - decrease|True|False - no change|True - doubles","High humidity decreases evaporation rate."],["T/F - Water Cycle Weather","<u>Water cycle directly affects many weather factors</u>.","True|False - no effect|False - only pressure|False - only rocks","Water cycle influences humidity, rain, temperature etc."],["T/F - Boiling 0C","<u>Pure water boils at 0°C</u> at normal pressure.","False - 100°C|True|False - 50°C|True at sea level","Pure water boils at 100°C, melts at 0°C."],["T/F - Constant Temp","<u>During melting and boiling temperature remains constant</u>.","True|False - increases|False - decreases|False - doubles","Heat is used to overcome forces, temperature plateaus."],["T/F - 10m Rule","Boiling point <u>decreases by 1°C per 10m rising</u>.","False - 300m|True|False - 1000m|True - 10m","Correct is 1°C per 300m, not 10m."],["T/F - Pressure Cooker Time","Time to cook food in <u>pressure cooker less than regular pot</u>.","True|False - more|False - equal|Fals
