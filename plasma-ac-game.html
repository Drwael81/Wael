<script>
  (function () {
    var id = 'plasma-ac-game';
    var cues = ['الجو نضف'];
    var attempts = 0;
    try { attempts = +(window.localStorage.getItem('sciencecraft-attempts-' + id) || 0); } catch (e) {}
    var done = false;
    var started = Date.now();
    setInterval(function () {
      if (done) return;
      if (Date.now() - started > 15 * 60 * 1000) { done = true; return; }
      var body = null;
      try { body = document.body; } catch (e) {}
      if (!body || !body.textContent) return;
      for (var i = 0; i < cues.length; i++) {
        if (body.textContent.indexOf(cues[i]) !== -1) {
          done = true;
          if (window.ScienceCraft && typeof window.ScienceCraft.report === 'function') {
            window.ScienceCraft.report({ completion: true, attempts: attempts + 1 });
          }
          return;
        }
      }
    }, 1200);
  })();
  </script>
