s are far apart, PE ~ 0, KE dominates."},{id:14,source:"Internal energy rise",question:"Internal energy of a system increases when:",rawOptions:["Average kinetic energy of particles increases","Number of molecules decreases","Volume decreases only","Mass decreases"],explanation:"Heating raises kinetic energy, thus internal energy rises."},{id:15,source:"Heat",question:"Energy transferred from a body at higher temperature to a body at lower temperature is called:",rawOptions:["Heat","Temperature","Internal energy","Work"],explanation:"Heat flows due to temperature difference."},{id:16,source:"Specific heat table",question:"Which has the lowest specific heat: Water 4186, Aluminum 900, Iron 450, Mercury 140 J/kg·°C?",rawOptions:["Mercury","Water","Aluminum","Iron"],explanation:"Mercury c=140 J/kg·°C is lowest among listed."},{id:17,source:"Specific heat table",question:"Which metal has specific heat about 900 J/kg·°C and is commonly used in cooking utensils?",rawOptions:["Aluminum","Iron","Copper","Lead"],explanation:"Aluminum c≈900 J/kg·°C, light and conducts well."},{id:18,source:"System example",question:"An open soft-drink can containing soda represents:",rawOptions:["Open system","Closed system","Isolated system","Internal system"],explanation:"It can exchange CO2 (matter) and heat with surroundings."},{id:19,source:"System example",question:"A sealed pressure cooker without releasing steam (temporarily) approximates:",rawOptions:["Closed system","Open system","Isolated system","Surrounding"],explanation:"Mass constant, energy can leave through walls."},{id:20,source:"Thermos",question:"A well-closed thermos flask containing hot tea best approximates:",rawOptions:["Isolated system","Open system","Closed system","Surroundings"],explanation:"Thermos minimizes both heat and matter exchange."},{id:21,source:"Mass change",question:"In which system does the mass change over time due to matter exchange?",rawOptions:["Open system only","Closed system only","Isolated system only","Closed and isolated"],explanation:"Only open system exchanges matter, so its mass can change."},{id:22,source:"Temperature change",question:"Which systems can show a change in temperature over time due to heat exchange?",rawOptions:["Open and closed systems","Isolated only","Open only","Isolated and closed"],explanation:"Open and closed exchange energy, so T can change; isolated cannot."},{id:23,source:"Fig - Cup vs Thermos",question:"In the figure, cup of hot tea (X) and thermos flask (Y): X is ... and Y is ...",rawOptions:["X Open system, Y Isolated system","X Closed, Y Open","X Isolated, Y Open","X Closed, Y Closed"],explanation:"Cup exchanges both matter and heat (open), thermos approximates isolated."},{id:24,source:"Kinetic speed",question:"At same temperature, which particles move slowest on average: iron atoms (heavy) vs water molecules vs air molecules?",rawOptions:["Iron (heaviest particles move slowest)","Water","Air","All move same speed"],explanation:"KE same at same T, but v = sqrt(2KE/m), heavier mass → lower speed."},{id:25,source:"Internal energy def",question:"Internal energy equals?",rawOptions:["Sum of total kinetic + total potential energies","Difference between kinetic and potential","Average kinetic only","Heat × mass"],explanation:"U = KE_total + PE_total."},{id:26,source:"Internal energy increase",question:"Internal energy of a system increases when its:",rawOptions:["Average kinetic energy increases with heating","Volume only decreases","Number of molecules decreases","Temperature stays constant while cooling"],explanation:"Heating raises KE and thus internal energy."},{id:27,source:"Potential energy",question:"Potential energy between particles decreases when:",rawOptions:["Gas condenses to liquid","Solid melts to liquid","Solid sublimes","Liquid boils"],explanation:"Condensation brings particles closer, lowering PE as bonds form."},{id:28,source:"Heating effect",question:"When a substance is heated, the particles that make it up will have:",rawOptions:["Increased average kinetic energy","Decreased average kinetic energy","Same kinetic but more potential only","Decreased number"],explanation:"Heating increases particle motion and average KE."},{id:29,source:"Heating iron",question:"When a piece of iron is heated, all of the following increase EXCEPT:",rawOptions:["Number of molecules in the piece","Average kinetic energy","Temperature","Internal energy"],explanation:"Number of molecules remains constant, mass conserved."},{id:30,source:"Particle speed",question:"Increasing the speed of particles in a system leads to increase in:",rawOptions:["Kinetic energy and temperature","Potential energy only","Mass of system","Number of particles"],explanation:"KE = ½mv², speed up → KE and T rise."},{id:31,source:"Factors ΔT",question:"Factors affecting amount of change in temperature of a system include all EXCEPT:",rawOptions:["Shape of container","Type of substance (specific heat)","Mass of substance","Amount of heat added"],explanation:"ΔT = Q/(m c), independent of container shape."},{id:32,source:"Heating water",question:"When a quantity of water is heated, which increases?",rawOptions:["Average kinetic energy of water molecules","Number of water molecules","Mass of water","Type of substance"],explanation:"Heating increases KE, not number or type."},{id:33,source:"Highest c",question:"Which has highest specific heat among Water 4186, Iron 450, Aluminum 900, Mercury 140 J/kg·°C?",rawOptions:["Water","Mercury","Iron","Aluminum"],explanation:"Water has highest specific heat, excellent coolant."},{id:34,source:"c depends on",question:"Specific heat of a metal sphere depends on:",rawOptions:["Type of its substance","Its mass","Its shape","Its volume"],explanation:"c is a material property, not dependent on mass or shape."},{id:35,source:"Water vs oil",question:"Two equal masses of water and oil at same initial T heated by same flame same time. Which shows greater temperature rise?",rawOptions:["Oil (lower specific heat ~2000 vs water 4186)","Water","Both same","Neither rises"],explanation:"ΔT = Q/(m c), lower c → higher ΔT, oil heats faster."},{id:36,source:"Mass effect",question:"Two different masses of same substance receive same amount of heat. Which has larger temperature change?",rawOptions:["Smaller mass","Larger mass","Both same","Depends on color"],explanation:"ΔT inversely proportional to mass."},{id:37,source:"Heat amount",question:"For same mass and substance, greater amount of heat added results in:",rawOptions:["Greater temperature change","Smaller temperature change","No change","Change in mass only"],explanation:"Q = m c ΔT, so ΔT ∝ Q."},{id:38,source:"Mercury thermometer",question:"Mercury is used in thermometers because:",rawOptions:["Expands uniformly and has wide liquid range (-39 to 357°C)","Has high specific heat","Is excellent coolant","Is cheapest liquid"],explanation:"Uniform expansion and high boiling point make mercury suitable."},{id:39,source:"Water cooling",question:"Water is used in car radiators because:",rawOptions:["High specific heat absorbs large engine heat with small T rise","Low specific heat","Low density","Easily freezes"],explanation:"High c makes it efficient coolant."},{id:40,source:"Low c cooking",question:"Metal with low specific heat heats up faster and is suitable for rapid heating cookware. Example:",rawOptions:["Copper (385 J/kg·°C) / Aluminum","Water","Glycerin","Ice"],explanation:"Low c means less heat needed to raise T, heats quickly."},{id:41,source:"Internal vs T",question:"Two beakers have same amount of water, one at 30°C, one at 60°C. Which has higher internal energy?",rawOptions:["60°C beaker","30°C beaker","Both same","Depends on beaker material"],explanation:"Higher T → higher KE → higher U for same mass."},{id:42,source:"T independence",question:"Temperature is independent of:",rawOptions:["Total mass of system","Average speed of particles","Particle motion","Heat flow direction"],explanation:"Temperature measures average KE, not total, so independent of total mass."},{id:43,source:"Heat vs T",question:"Which statement distinguishes heat from temperature correctly?",rawOptions:["Heat is energy in transit due to T difference; temperature is average KE","Heat is average KE; temperature is total energy","Both are same","Heat is mass dependent, temperature not"],explanation:"Heat = transferred energy, temperature = average KE."},{id:44,source:"Units",question:"SI unit of specific heat is:",rawOptions:["J/kg·°C (or J/kg·K)","J/°C","J/kg","Calorie"],explanation:"c = Q/(m ΔT), unit J/kg·K."},{id:45,source:"Radiator",question:"Function of car radiator is to:",rawOptions:["Dissipate heat from engine to surroundings using water circulation","Protect tyres from heat","Store fuel","Increase internal energy of engine"],explanation:"Radiator is heat exchanger cooling the engine."},{id:46,source:"Complete",question:"Complete: The substance in a thermal system may be solid, liquid, gas or ___",rawOptions:["Mixture of them","Only solid","Only open system","Only energy"],explanation:"System may contain multiple phases as mixture."},{id:47,source:"Complete",question:"Systems are classified according to ability to exchange energy and matter into:",rawOptions:["Open, closed, isolated","Hot, cold, warm","Solid, liquid, gas","Heat, temperature, specific heat"],explanation:"Three types based on exchange capability."},{id:48,source:"Complete",question:"Energy exchange occurs in both ___ and ___ systems.",rawOptions:["Open and closed","Isolated only","Closed and isolated","Open and isolated"],explanation:"Open and closed can exchange energy; isolated cannot."},{id:49,source:"Complete",question:"There is no exchange of matter in either of the two systems:",rawOptions:["Closed and isolated","Open and closed","Open only","Open and isolated"],explanation:"Closed and isolated keep mass constant."},{id:50,source:"Complete",question:"Amount of change in temperature depends on type of substance, i.e., its ___",rawOptions:["Specific heat","Color","Shape","Surroundings"],explanation:"Different substances have different c."},{id:51,source:"Complete",question:"Amount of temperature change varies when heating different masses of same substance with same heat because ΔT is ___ proportional to mass.",rawOptions:["Inversely","Directly","Not related to","Exponentially"],explanation:"ΔT = Q/(m c) → inverse with m."},{id:52,source:"Complete",question:"For same mass and same substance, ΔT is directly proportional to amount of ___",rawOptions:["Heat added (thermal energy)","Volume","System boundary","Surroundings"],explanation:"More Q → larger ΔT."},{id:53,source:"Complete",question:"Specific heat of a substance varies according to its ___ and ___",rawOptions:["Type of substance and its physical state","Mass and volume","Color and shape","Temperature only"],explanation:"c depends on material and phase (ice 2090 vs water 4186)."},{id:54,source:"Complete",question:"When specific heat of a substance is high, the amount of heat required to raise its temperature by 1°C is ___",rawOptions:["Large","Small","Zero","Negative"],explanation:"High c means needs more heat per degree."},{id:55,source:"Complete",question:"Amount of increase in temperature of a mass of ice is ___ compared to same mass of water when gaining same heat (ice c=2090, water 4186).",rawOptions:["Twice as much (higher ΔT)","Same","Half","Zero"],explanation:"ΔT = Q/(m c), lower c → higher ΔT, so ice rises twice."},{id:56,source:"Complete",question:"Internal energy of water ___ when temperature rises from 20°C to 30°C due to increase in kinetic energy.",rawOptions:["Increases","Decreases","Remains constant","Becomes zero"],explanation:"U increases with T due to KE increase."},{id:57,source:"Complete",question:"When water vapour condenses on a leaf, its potential energy ___ and kinetic energy ___",rawOptions:["Decreases, decreases","Increases, increases","Decreases, increases","Increases, decreases"],explanation:"Condensation reduces distance (PE) and slows particles (KE), releases heat."},{id:58,source:"Complete",question:"When a warm system is placed in a refrigerator, heat flows from ___ to ___",rawOptions:["System to surroundings (refrigerator interior)","Surroundings to system","System to isolated","No flow"],explanation:"Heat flows from hot to cold."},{id:59,source:"Complete",question:"Two different masses of distilled water at same temperature heated equally for same time, smaller mass shows ___ temperature rise.",rawOptions:["Larger","Smaller","Same","No"],explanation:"Smaller m → larger ΔT for same Q."},{id:60,source:"Complete",question:"Specific heat is quantity of heat needed to raise temperature of ___ of substance by ___",rawOptions:["1 kg by 1°C (or 1 K)","1 g by 10°C","1 kg by 10°C","10 kg by 1°C"],explanation:"Definition of specific heat c."},{id:61,source:"T/F Cooling",question:"Mercury is an excellent liquid for cooling car engines. True/False? Correct liquid?",rawOptions:["False, Water is excellent due to high specific heat","True, Mercury is excellent","False, Alcohol is excellent","True, Iron is excellent"],explanation:"Mercury c=140 low, poor coolant; water c=4186 ideal."},{id:62,source:"T/F Ice vs water",question:"Specific heat of ice (2090 J/kg·°C) equals specific heat of liquid water (4186). True/False?",rawOptions:["False, ice c is about half of water (2090 vs 4186)","True, both equal 4186","True, both equal 2090","False, ice c is double water"],explanation:"c depends on phase; water higher than ice."},{id:63,source:"T/F Radiator",question:"Radiator protects car tyres from damage due to heat. True/False?",rawOptions:["False, radiator protects engine from overheating","True, protects tyres","False, protects glass","True, protects brakes"],explanation:"Radiator cools engine, not tyres."},{id:64,source:"T/F Heat indication",question:"Transfer of heat to or from a body is indicated by change (not stability) of its temperature when no phase change.",rawOptions:["True, heat transfer indicated by temperature change","False, indicated by stability","True, stability indicates heat","False, no relation"],explanation:"Q causes ΔT if no phase change."},{id:65,source:"T/F Mass effect",question:"Amount of temperature change increases with increase in mass when gaining same heat. True/False?",rawOptions:["False, ΔT decreases with mass (ΔT ∝ 1/m)","True, increases with mass","False, independent of mass","True, mass doubles ΔT"],explanation:"Larger mass needs more heat for same ΔT."},{id:66,source:"T/F c state",question:"Specific heat varies according to physical state of substance. True/False?",rawOptions:["True, e.g., ice 2090 vs water 4186 vs steam 2010","False, same for all states","True, varies with color","False, varies with mass"],explanation:"c depends on molecular arrangement."},{id:67,source:"T/F Sodium thermometer",question:"Sodium is used in manufacture of thermometers. True/False?",rawOptions:["False, Mercury (or alcohol) is used, not sodium","True, sodium is used","False, water is used","True, sodium is ideal"],explanation:"Mercury has uniform expansion; sodium is reactive."},{id:68,source:"T/F Water cooling reason",question:"Water is ideal for cooling due to low specific heat. True/False?",rawOptions:["False, due to high specific heat (4186)","True, due to low specific heat","False, due to low density","True, due to high density"],explanation:"High c absorbs large heat with small rise."},{id:69,source:"T/F Open system",question:"Open system only exchanges energy with surroundings. True/False?",rawOptions:["False, open system exchanges both matter and energy","True, only energy","False, exchanges neither","True, only matter"],explanation:"Open = both matter and energy."},{id:70,source:"T/F Thermos",question:"Thermos flask represents closed system. True/False? What does it represent?",rawOptions:["False, it approximates isolated system","True, closed system","False, open system","True, open system"],explanation:"Thermos minimizes both exchanges → isolated idealization."},{id:71,source:"T/F Soft drink can",question:"Metallic soft drink can with open top represents isolated system. True/False? Correct type?",rawOptions:["False, it is open system (matter can escape)","True, isolated","False, closed","True, closed"],explanation:"Open top allows CO2 and heat exchange → open system."},{id:72,source:"T/F Internal energy",question:"Internal energy is difference between potential and kinetic energies. True/False?",rawOptions:["False, it is sum of potential + kinetic","True, difference","False, product","True, average"],explanation:"U = PE + KE total, not difference."},{id:73,source:"T/F Heat vs T",question:"Heat is measure of average kinetic energy of particles. True/False? Correct term?",rawOptions:["False, temperature is average KE; heat is transferred energy","True, heat is average KE","False, internal energy is average KE","True, heat is average"],explanation:"Temperature = average KE, heat = energy in transit."},{id:74,source:"T/F Speed and T",question:"A decrease in average speed of particles is accompanied by constant temperature. True/False?",rawOptions:["False, decrease in speed means decrease in temperature","True, constant","False, increase in temperature","True, increase in speed constant"],explanation:"T ∝ average KE ∝ v², speed down → T down."},{id:75,source:"T/F Open matter only",question:"In open system there is only exchange of matter. True/False?",rawOptions:["False, both matter and energy are exchanged","True, only matter","False, only energy","True, neither"],explanation:"Open exchanges both matter and energy."},{id:76,source:"Give reason",question:"Why does internal energy of water increase when heated from 60°C to 70°C?",rawOptions:["Because average kinetic energy of molecules increases with temperature","Because number of molecules increases","Because mass decreases","Because potential energy only decreases"],explanation:"Heating raises KE, so internal energy U rises."},{id:77,source:"Give reason",question:"Why does water vapour condensing on a leaf release heat to surroundings?",rawOptions:["Because vapour loses kinetic and potential energy forming liquid bonds","Because vapour gains energy","Because leaf absorbs cold","Because mass increases"],explanation:"Condensation is exothermic, PE drops as hydrogen bonds form."},{id:78,source:"What happens",question:"A quantity of warm water is placed in a refrigerator. What happens to its internal energy and temperature?",rawOptions:["Both decrease as heat flows to surroundings","Both increase","Internal decreases but T increases","T decreases but U increases"],explanation:"Refrigerator colder, heat leaves water, T and U drop."},{id:79,source:"Application - Cookware",question:"Four equal masses of metals heated 10 min same source, ΔT: Al 40°C, Fe 80°C, Cu 90°C, Pb 120°C. Which is best for cookware that should not heat too rapidly and withstands high heat?",rawOptions:["Aluminum (lowest ΔT, highest c, heats slowly, stable)","Lead (highest ΔT)","Copper","Iron"],explanation:"High c material heats slowly, more stable; Al highest c among metals here."},{id:80,source:"Compare cubes",question:"Which cube has greatest temperature increase when heated with same flame for same time? Options: small lead cube vs large iron cube.",rawOptions:["Small lead cube (smallest mass and lowest c=128)","Large water cube (high c and large mass)","Large iron cube","Medium aluminum"],explanation:"ΔT = Q/(m c), minimized denominator gives max ΔT."},{id:81,source:"Ice curve",question:"Ice heating curve plateau at 0°C: What happens to kinetic and potential energies?",rawOptions:["KE (T) stays constant, PE increases as bonds break, internal energy increases","KE increases, PE decreases","Both stay constant","Both increase rapidly"],explanation:"During melting, added heat increases PE, not KE, T plateau."},{id:82,source:"Table time",question:"Table shows time to raise 1°C for identical rods W 35min, X 30min, Y 45min, Z 40min with same heater. Which has lowest specific heat?",rawOptions:["X (shortest time → lowest c)","Y (longest time highest c)","Z","W"],explanation:"Q = P·t = m c ΔT, so t ∝ c, shortest t = lowest c."},{id:83,source:"Intensive property",question:"Specific heat of 1 kg iron is 450 J/kg·°C. What is specific heat of 10 kg iron piece?",rawOptions:["Same 450 J/kg·°C (intensive property)","4500 J/kg·°C","45 J/kg·°C","450 J/10kg·°C"],explanation:"Specific heat independent of mass; it's intensive."},{id:84,source:"Give reason",question:"Give reason: Water is excellent liquid for cooling systems.",rawOptions:["High specific heat 4186 absorbs large heat with small T rise","Low specific heat","High density","Low boiling point"],explanation:"High c makes it efficient coolant, absorbs large heat."},{id:85,source:"Define",question:"What is meant by specific heat of water is 4186 J/kg·°C?",rawOptions:["4186 J needed to raise 1 kg water by 1°C","4186 J released per kg","4186 °C per Joule","4186 kg per Joule"],explanation:"Definition: energy per unit mass per degree."},{id:86,source:"What happens",question:"What happens when two different masses of distilled water at same initial T are heated separately for equal period using steady flame?",rawOptions:["Smaller mass reaches higher temperature (greater ΔT)","Larger mass higher","Both same","Both decrease"],explanation:"Same Q, ΔT ∝ 1/m, smaller heats more."},{id:87,source:"What happens",question:"Two equal masses of water and oil same initial T heated equally for same time. What happens?",rawOptions:["Oil temperature rises about twice water because oil c ~2000 half of water","Water rises more","Both same","Oil cools"],explanation:"Lower c → higher ΔT, oil heats faster."},{id:88,source:"What happens",question:"Two equal masses of water at 0°C and ice at 0°C heated equally for short period (melting not complete). Which shows temperature rise?",rawOptions:["Water temperature rises, ice stays at 0°C during melting","Both rise
