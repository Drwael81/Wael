  <script>
  (function () {
    var META = { gameId: 'science-craft-race', scoringType: 'points', maxScore: 100 };
    window.ScienceCraft = {
      gameId: META.gameId,
      meta: META,
      report: function (payload) {
        try {
          payload = payload || {};
          if (typeof window.ScienceCraftScores === 'undefined') return null;
          var merged = {
            gameId: META.gameId,
            scoringType: META.scoringType,
            maxScore: META.maxScore
          };
          for (var k in payload) {
            if (Object.prototype.hasOwnProperty.call(payload, k)) merged[k] = payload[k];
          }
          return window.ScienceCraftScores.record(merged);
        } catch (e) { return null; }
      }
    };
  })();
  </script>

<script>
  (function () {
    var id = 'science-craft-race';
    var cues = ['الترتيب النهائي', 'برافو! فهمت السبب'];
    var attempts = 0;
    try { attempts = +(window.localStorage.getItem('sciencecraft-attempts-' + id) || 0); } catch (e) {}
    var done = false;
    var started = Date.now();
    setInterval(function () {
      if (done) return;

      var body = null;
      try { body = document.body; } catch (e) {}

          if (window.ScienceCraft && typeof window.ScienceCraft.report === 'function') {

          return;
        }
      }

  })();
