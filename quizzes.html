<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبارات · www.2ndPrepFunnyScienceLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --paper:#EEF1EA;
    --paper-line: rgba(31,41,55,0.06);
    --ink:#1E2A33;
    --ink-soft:#5B6B72;
    --card-bg:#FBFCF9;
    --solid:#A85C32;
    --liquid:#24567A;
    --gas:#1E8A72;
    --shadow: 0 10px 30px rgba(30,42,51,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 34px),
      var(--paper);
    color:var(--ink);
    font-family:'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height:100vh;
  }

  .site-header{
    position:sticky; top:0; z-index:40;
    background: rgba(238,241,234,0.9);
    backdrop-filter: blur(6px);
    border-bottom:1px solid rgba(30,42,51,0.1);
    padding:14px 20px;
  }
  .site-header-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-family:'Cairo', sans-serif; font-weight:900; font-size:16px;
    direction:ltr; text-align:left;
  }
  .brand-url{ font-weight:700; color:var(--ink-soft); }
  .back-link{
    font-family:'Cairo', sans-serif; font-weight:700; font-size:13.5px;
    color:var(--ink); text-decoration:none;
    background:#fff; border:1px solid rgba(30,42,51,0.14);
    padding:7px 16px; border-radius:999px;
    transition: background .15s ease, color .15s ease;
  }
  .back-link:hover{ background:var(--ink); color:#fff; }

  .wrap{max-width:900px; margin:0 auto; padding:44px 20px 70px;}
  header.page-head{ text-align:center; margin-bottom:40px; }
  .eyebrow{
    display:inline-block; font-family:'Cairo', sans-serif; font-weight:700; font-size:13px;
    color:var(--ink-soft); background:#fff; border:1px solid rgba(30,42,51,0.12);
    padding:6px 16px; border-radius:999px; margin-bottom:18px;
  }
  h1{
    font-family:'Cairo', sans-serif; font-weight:900;
    font-size:clamp(28px,4.5vw,42px); margin:0 0 14px;
  }
  .page-head p{ color:var(--ink-soft); font-size:15.5px; max-width:600px; margin:0 auto; }

  .quiz-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:22px;
  }
  .quiz-card{
    background:var(--card-bg); border-radius:18px; box-shadow:var(--shadow);
    padding:24px 22px; text-decoration:none; color:var(--ink);
    display:flex; flex-direction:column; gap:10px;
    border-top:6px solid var(--solid);
    transition: transform .15s ease;
  }
  .quiz-card:hover{ transform:translateY(-3px); }
  .quiz-icon{ font-size:34px; }
  .quiz-title{ font-family:'Cairo', sans-serif; font-weight:800; font-size:17px; }
  .quiz-desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; }
  .quiz-count{
    font-family:'Cairo', sans-serif; font-weight:700; font-size:11.5px;
    color:var(--solid); background: color-mix(in srgb, var(--solid) 12%, white);
    display:inline-block; padding:4px 12px; border-radius:999px; width:fit-content;
  }
  .quiz-cta{
    margin-top:auto; font-family:'Cairo', sans-serif; font-weight:700; font-size:13px;
    color:var(--solid);
  }

  .empty-state{
    text-align:center; color:var(--ink-soft); padding:60px 20px;
    background:var(--card-bg); border-radius:18px; box-shadow:var(--shadow);
  }

  footer.site-footer{
    text-align:center; padding:26px 20px 40px; color:var(--ink-soft); font-size:13px;
  }
</style>
</head>
<body>

  <div class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <span style="font-size:20px;">📝</span>
        <span><span class="brand-url">www.</span>2nd Prep. Funny Science lab — الاختبارات</span>
      </div>
      <a href="index.html" class="back-link">↩ رجوع للرئيسية</a>
    </div>
  </div>

  <div class="wrap">
    <header class="page-head">
      <span class="eyebrow">الاختبارات التفاعلية</span>
      <h1>اختبر فهمك</h1>
      <p>أسئلة تفاعلية بتصحيح فوري — اختار اختبار وابدأ، وشوف نتيجتك في الآخر.</p>
    </header>

    <div class="quiz-grid" id="quizGrid">
      <!-- الكروت بتتولّد ديناميكيًا تحت من quizzesData -->
    </div>
  </div>

  <footer class="site-footer">www.2ndPrepFunnyScienceLab · By #Dr_Wael_Aboagiza</footer>

<script src="quizzes-data.js"></script>
<script>
  (function(){
    const grid = document.getElementById('quizGrid');
    if (typeof quizzesData === 'undefined' || !Array.isArray(quizzesData) || quizzesData.length === 0) {
      grid.innerHTML = '<div class="empty-state">مفيش اختبارات متاحة دلوقتي.</div>';
      return;
    }
    grid.innerHTML = quizzesData.map(quiz => {
      const count = quiz.questions ? quiz.questions.length : 0;
      return (
        '<a href="quiz.html?id=' + encodeURIComponent(quiz.id) + '" class="quiz-card">' +
          '<div class="quiz-icon">🧪📝</div>' +
          '<div class="quiz-count">' + count + ' سؤال</div>' +
          '<div class="quiz-title">' + quiz.title + '</div>' +
          '<div class="quiz-cta">ابدأ الاختبار ←</div>' +
        '</a>'
      );
    }).join('');
  })();
</script>

</body>
</html>
