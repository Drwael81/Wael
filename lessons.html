<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدروس · مختبر العلوم الممتع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --paper:#EEF1EA;
    --paper-line: rgba(31,41,55,0.06);
    --ink:#1E2A33;
    --ink-soft:#5B6B72;
    --card-bg:#FBFCF9;
    --solid:#A85C32;
    --liquid:#24567A;
    --gas:#1E8A72;
    --shadow: 0 10px 30px rgba(30,42,51,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 34px),
      var(--paper);
    color:var(--ink);
    font-family:'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height:100vh;
  }

  .site-header{
    position:sticky; top:0; z-index:40;
    background: rgba(238,241,234,0.9);
    backdrop-filter: blur(6px);
    border-bottom:1px solid rgba(30,42,51,0.1);
    padding:14px 20px;
  }
  .site-header-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    font-family:'Cairo', sans-serif; font-weight:900; font-size:16px;
    direction:ltr; text-align:left;
  }
  .brand-url{ font-weight:700; color:var(--ink-soft); }
  .back-link{
    font-family:'Cairo', sans-serif; font-weight:700; font-size:13.5px;
    color:var(--ink); text-decoration:none;
    background:#fff; border:1px solid rgba(30,42,51,0.14);
    padding:7px 16px; border-radius:999px;
    transition: background .15s ease, color .15s ease;
  }
  .back-link:hover{ background:var(--ink); color:#fff; }

  .wrap{max-width:900px; margin:0 auto; padding:44px 20px 70px;}
  header.page-head{ text-align:center; margin-bottom:40px; }
  .eyebrow{
    display:inline-block; font-family:'Cairo', sans-serif; font-weight:700; font-size:13px;
    color:var(--ink-soft); background:#fff; border:1px solid rgba(30,42,51,0.12);
    padding:6px 16px; border-radius:999px; margin-bottom:18px;
  }
  h1{
    font-family:'Cairo', sans-serif; font-weight:900;
    font-size:clamp(28px,4.5vw,42px); margin:0 0 14px;
  }
  .page-head p{ color:var(--ink-soft); font-size:15.5px; max-width:600px; margin:0 auto; }

  .lesson-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:22px;
  }
  .lesson-card{
    background:var(--card-bg); border-radius:18px; box-shadow:var(--shadow);
    padding:24px 22px; text-decoration:none; color:var(--ink);
    display:flex; flex-direction:column; gap:10px;
    border-top:6px solid var(--liquid);
    transition: transform .15s ease;
  }
  .lesson-card:hover{ transform:translateY(-3px); }
  .lesson-icon{ font-size:34px; }
  .lesson-title{ font-family:'Cairo', sans-serif; font-weight:800; font-size:17px; }
  .lesson-desc{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; }
  .lesson-cta{
    margin-top:auto; font-family:'Cairo', sans-serif; font-weight:700; font-size:13px;
    color:var(--liquid);
  }

  .soon-card{
    border:1.5px dashed rgba(30,42,51,0.25); border-radius:18px;
    padding:24px 22px; color:var(--ink-soft); font-size:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px;
  }

  footer.site-footer{
    text-align:center; padding:26px 20px 40px; color:var(--ink-soft); font-size:13px;
  }
</style>
<!-- Design System (Phase 1) -->
<link rel="stylesheet" href="style.css">
<script src="site-enhance.js" defer></script>
</head>
<body>

  <div class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <span style="font-size:20px;">📚</span>
        <span><span class="brand-url">www.</span>2nd Prep. Funny Science lab — الدروس</span>
      </div>
      <a href="index.html" class="back-link">↩ رجوع للتجارب</a>
    </div>
  </div>

  <div class="wrap">
    <header class="page-head">
      <span class="eyebrow">الدروس الكاملة</span>
      <h1>دروس شرح مبسّطة</h1>
      <p>شرح كامل لكل درس بشكل مرئي وتفاعلي، بالإضافة للتجارب اللي في الصفحة الرئيسية.</p>
    </header>

    <div class="lesson-grid" id="lessonGrid">
      <!-- كروت الدروس بتتولّد ديناميكيًا من lessons-data.js وتتحط قبل الكارت ده -->
      <div class="soon-card" id="lessonSoonCard">
        <div style="font-size:28px;">➕</div>
        دروس تانية هتتضاف هنا قريبًا
      </div>
    </div>
  </div>

  <footer class="site-footer">www.2ndPrepFunnyScienceLab · By #Dr_Wael_Aboagiza</footer>

<script src="lessons-data.js"></script>
<script>
  (function(){
    const grid = document.getElementById('lessonGrid');
    const anchor = document.getElementById('lessonSoonCard');
    if (!grid || typeof lessonsData === 'undefined' || !Array.isArray(lessonsData)) return;

    const cards = lessonsData
      .filter(l => l && l.status === 'published' && l.href && l.title)
      .sort((a, b) => (a.order || 0) - (b.order || 0))
      .map(l => (
        '<a href="' + l.href + '" class="lesson-card">' +
          '<div class="lesson-icon">' + (l.icon || '📘') + '</div>' +
          '<div class="lesson-title">' + l.title + '</div>' +
          '<div class="lesson-desc">' + (l.desc || '') + '</div>' +
          '<div class="lesson-cta">' + (l.cta || 'ابدأ الدرس ←') + '</div>' +
        '</a>'
      )).join('');

    if (!cards) return;
    if (anchor) anchor.insertAdjacentHTML('beforebegin', cards);
    else grid.innerHTML = cards;
  })();
</script>

</body>
</html>
