contact when their temperatures become equal is called ...","Thermal equilibrium|Thermal conduction|Thermal convection|Thermal radiation","Thermal equilibrium is equal temperatures and net heat transfer stops."],["Scientific Term 3","Transfer of heat through solids without transfer of the material particles themselves is called ...","Thermal conduction|Thermal convection|Thermal radiation|Thermal current","Conduction occurs by vibration of molecules and free electrons in metals."],["Scientific Term 4","A measure of how well a material conducts heat is called ...","Thermal conductivity|Heat capacity|Specific heat|Density","Thermal conductivity - higher means better conductor."],["Scientific Term 5","Materials that conduct heat well are called ...","Good thermal conductors|Thermal insulators|Transparent materials|Radioactive materials","Conductors like copper, aluminum, silver, diamond."],["Scientific Term 6","Materials that do not conduct heat well are called ...","Thermal insulators / Poor conductors|Good conductors|Radioactive materials|Magnetic materials","Insulators like wood, plastic, wool, air."],["Scientific Term 7","Heat transfer by convection due to density difference of fluid particles is called ...","Thermal convection|Thermal conduction|Thermal radiation|Conductivity","Convection occurs only in liquids and gases."],["Scientific Term 8","Heat transfer that does not need a material medium to transfer is called ...","Thermal radiation|Conduction|Convection|Conductivity","Radiation travels in vacuum and air via electromagnetic waves."],["Scientific Term 9","Waves that travel in vacuum at 300,000 km/s are called ...","Electromagnetic waves|Sound waves|Water waves|Convection waves","Light and infrared are electromagnetic waves."],["Scientific Term 10","The camera that senses thermal radiation emitted from bodies and converts it to colored images is called ...","Thermal / Infrared imaging camera|Microscope|Telescope|Normal camera","Thermography converts temperature differences into colors."],["Scientific Term 11","Transfer of thermal energy in fluids via movement of hot particles up and cold down is called ...","Convection current|Conduction current|Electromagnetic wave|Electric current","Convection current is circular movement of hot rising and cold sinking fluid."],["Scientific Term 12","The effect caused by infrared rays on photographic films and skin is called the ... effect","Chemical|Physical|Mechanical|Magnetic","Infrared has chemical and thermal effect, causing skin reddening and affecting films."],["Multiple Choice 13","All of the following heat transfer methods are correct except ...","Vibration|Conduction|Convection|Radiation","There are only three methods: conduction, convection, radiation. Vibration is a mechanism inside conduction, not independent."],["Multiple Choice 14","Heat transfers through metallic bodies via ... only","Conduction|Convection|Radiation|Convection and radiation","Metals are solids, particles don't move freely, so conduction dominates."],["Multiple Choice 15","... is a measure of how well a material conducts heat","Thermal conductivity|Specific heat|Heat capacity|Density","Direct definition of thermal conductivity."],["Multiple Choice 16","Which material has very high thermal conductivity?","Diamond|Wood|Plastic|Polystyrene","Diamond has highest known ~2000 W/mK, then silver, then copper."],["Multiple Choice 17","All of the following are good heat conductors except ...","Wood|Copper|Aluminum|Silver","Wood is insulator, rest are good metal conductors."],["Multiple Choice 18","Cooking pot handles are made of plastic or wood because ...","Plastic and wood are poor conductors|Plastic is good conductor|Wood melts quickly|Plastic is only cheap","To prevent heat transfer to hand and burns, we use insulators."],["Multiple Choice 19","... is used in electronic cooling systems for high conductivity and ease of forming","Aluminum|Iron|Wood|Glass","Aluminum is common in heat sinks; copper also but alu diation|Conduction only|Convection only|Conduction and convection only","Radiation is the only one that travels in vacuum and also in air."],["Multiple Choice 29","Heat transfers in gases via ...","Convection and radiation|Conduction only|Conduction and convection only|Conduction and radiation only","Gases have very weak conduction, convection is main and radiation participates."],["Multiple Choice 30","Sun heat reaches us by ... while heater heat reaches us in room by ...","Radiation - Convection|Conduction - Radiation|Convection - Conduction|Radiation - Conduction","Sun via vacuum is radiation, heater warms air which rises by convection."],["Multiple Choice 31","The camera that detects radiation emitted from bodies and converts to colored images is called ... camera","Thermal imaging|Normal optical| X-ray| Ultrasound","Infrared camera detects thermal differences."],["Multiple Choice 32","Snakes hunt at night due to presence of ...","Pits sensitive to infrared radiation|Eyes that see in complete darkness|Sensitive ear|Sensing horns","Pit organs detect mammalian heat."],["Multiple Choice 33","When heat transfers by radiation then hot water particles ... and cold ... (description of accompanying convection current)","Rise up - Sink down|Sink down - Rise up|Stay still|Evaporate only","This describes convection current: hot less dense rises, cold sinks."],["Multiple Choice 34","Sea breeze phenomenon is more noticeable in ... season","Summer|Winter|Only autumn|Night","In summer difference between land and water temp is large during day causing strong breeze."],["Multiple Choice 35","Heat transfers through fluids (liquids and gases) mainly via ...","Convection|Conduction only|Radiation only|Conduction and radiation only","Fluids particles move freely, convection is dominant method."],["Multiple Choice 36","When air is heated its density ... and it ...","Decreases - Rises up|Increases - Rises up|Decreases - Sinks down|Increases - Sinks down","Hot air expands density decreases so it rises (hot air balloon principle)."],["Multiple Choice 37","Sea breeze occurs daytime because ...","Land is hotter than sea|Sea is hotter than land|Temperatures equal|Unrelated to temperature","Land has lower specific heat so heats faster than water, its air heats rises and cold air from sea replaces it."],["Multiple Choice 38","Heat transfer by radiation can happen through ...","Material and non-material media|Liquids only|Solids only|Metals only","Radiation needs no medium, travels in vacuum and matter."],["Multiple Choice 39","Infrared rays ...","Are well absorbed by dark opaque surfaces and reflected by shiny|Absorbed by shiny|Never absorbed|Transfer by conduction only","Black absorbs radiation, white shiny and silver reflects it (firefighter clothes shiny)."],["Multiple Choice 40","Which electromagnetic waves have clear thermal effect?","Infrared rays|Gamma rays|X-rays|Radio waves","Infrared is responsible for feeling warmth."],["Multiple Choice 41","Which of the following waves has thermal effect and causes feeling of warmth when exposed to sun?","Infrared|Ultraviolet|Visible light only|Sound waves","Infrared is thermal, ultraviolet is chemical causing sunburn."],["Multiple Choice 42","Arrange materials ascending by thermal conductivity: copper, silver, diamond","Copper < Silver < Diamond|Diamond < Silver < Copper|Silver < Copper < Diamond|Copper < Diamond < Silver","Values: copper ~385, silver ~429, diamond ~2000 W/mK, so ascending copper then silver then diamond."],["Multiple Choice 43","Factor affecting heat transfer from one body to another is ...","Thermal conductivity and temperature difference and material type|Color only|Mass only|Shape only","Transfer depends on temperature difference and material nature and conductivity and area."],["Multiple Choice 44","Mention heat transfer methods","Conduction, Convection and Radiation|Conduction only|Convection and radiation only|Vibration and rotation","Three basic methods."],["Multiple Choice 45","When does heat transfer stop between two contacting bodies one 100C and other 60C if equal mass and material?","When they reach equilibrium 80C|At 100C|At 60C|Never stops","Average (100+60)/2=80 at same mass and type, then thermal equilibrium."],["Textbook Q46","When taking a pastry tray from oven and placing on metal surface, heat transfers from ...","Pastries to tray then to air and surface|Air to pastries|Tray to pastries|No transfer","Heat from higher (hot pastries) to lower (tray and air)."],["Textbook Q47","Heat transfers from tray to ...","Air and metal surface|Pastries only|Oven|Does not transfer","Hot tray loses heat to air by convection and radiation and to metal surface by conduction."],["Textbook Q48","Lemon drink temp 20C with ice cube, after 2 min mixture became 8C, temp of remaining part of ice cube ...","0C|8C|20C|-5C","Ice during melting is 0C until fully melted, even if mixture is 8C remaining solid part is 0C."],["Textbook Q49","What happens to cold air outside boiler when it touches its hot outer surface?","Its density decreases and rises up|Density increases and sinks|Density decreases and sinks|No change","Cold air heats density decreases rises forming convection current."],["Textbook Q50","Equal metal balls fixed with wax on rods of different materials A,B,C, when heated balls A fell first then B then C, arrange materials descending by conductivity","A > B > C|C > B > A|B > A > C|A = B = C","Who falls first conducts faster, so A highest conductivity."],["Textbook Q51","Four pins fixed with wax on rods X and Y, pins A,C,D fell before B, scientific explanation ...","Thermal conductivity of X greater than Y so wax melted faster on X|Gravity|Different wax|Heat did not reach","Better conducting rod transfers heat faster to distant pins."],["Textbook Q52","Teacher advised students to lie down on ground when smoke spreads from fire, explanation by convection ...","Hot smoke less dense rises up and fresh cold air stays near ground|Smoke sinks|Smoke does not move|Ground absorbs smoke","Smoke as hot gas low density rises, so closest fresh air is near bottom."],["Textbook Q53","Two rods one copper and other glass with pins fixed with wax and one heat source, which pin falls first?","Pin closest to heat source on copper rod|Farthest pin on glass|Both together|Glass pin first","Copper is excellent conductor transfers heat quickly, close wax melts first."],["Textbook Q54","Bodies A and B same material and same mass, temp A=40C and B=5C, at thermal equilibrium temp will be ...","22.5C|(40+5)/2 =22.5C|40C|5C","Arithmetic average at equal mass and type."],["Textbook Q55","What is expected temperature of bodies at thermal equilibrium?","Same degree 22.5C for both|40C and 5C as is|100C|0C","At equilibrium they become equal in temperature."],["Textbook Q56","Four pins on copper and glass rods, which falls first with explanation?","Copper pin close because good conductor|Close glass pin|Far pin|None falls","Explanation: copper conductivity much higher than glass insulator."],["Textbook Q57","Two equal amounts water A temp 40C and B temp 5C when mixed, which graph represents temp vs time?","Two curves meeting at 22.5C with stability|Straight line rising|Two lines not meeting|One curve only","Hot temp decreases and cold increases until they meet at equilibrium."],["Textbook Q58","Thermos with double walls X and Y with vacuum between, with hot liquid, which statements true?","Vacuum reduces heat transfer by conduction and convection|Vacuum increases conduction|Walls increase radiation|Vacuum useless","Thermos idea: vacuum prevents conduction and convection, shiny surface reflects radiation."],["Textbook Q59","Bodies A and B heat transfer happened between them, temp of body B compared to A ...","Was less before contact and became higher after period then equalizes at equilibrium|Was always higher|Was always less|Does not change","Cold body temp rises at expense of hot until equilibrium."],["Textbook Q60","When placing ice cube in ition for heat transfer is temperature difference."],["Textbook Q68","Two identical ice cubes one on metal mass and other on wood mass, which melts faster?","That on metal because good conductor transfers ambient heat to ice quickly|That on wood|Both together|None melts","Metal conducts room heat to ice quickly melts faster, wood insulator."],["Textbook Q69","Why feel heat of flame without touching? What happens if metal rod replaced with wooden?","Feel by radiation, metal rod conducts heat to hand while wooden does not|Feel nothing|Wooden conducts more|Flame does not radiate","Feeling at distance is radiation, rod experiment is conduction."],["Textbook Q70","How does heat transfer from heated end of copper rod to other end?","By conduction via vibration of particles and movement of free electrons|By convection|By radiation only|Does not transfer","Conduction in metals via two mechanisms: lattice vibration and fast free electrons."],["Textbook Q71","When does heat transfer stop between two contacting bodies 100C and 60C?","When they equalize in temperature (thermal equilibrium) ~80C if equal type and mass|At 100C|At 0C|Never stops","Net transfer stops at equilibrium."],["Textbook Q72","Number of heat transfer methods","Three methods: conduction, convection and radiation|One method|Four methods|Two methods","Three known."],["Textbook Q73","What is scientific basis for sea breeze?","Thermal convection - difference in specific heat of land and water|Conduction only|Radiation only|Gravity","Land heats faster daytime so its air rises and cold air from sea comes - convection current."],["Textbook Q74","Mention life application of heat transfer by conduction","Making cooking utensils from copper and aluminum|Sea breeze|Thermal imaging|Heater","Good conductors used in cooking and heat exchangers."],["Textbook Q75","Mention importance of thermal imaging Thermography","Medical detection and diagnosis of inflammations and detecting people at night and building inspection|Cooking|Cooling only|No importance","Used in medicine, search and rescue, detecting heat leaks."],["Textbook Q76","How do nocturnal animals hunt prey in darkness?","By sensing infrared radiation emitted from prey bodies|By hearing only|By chance|Do not hunt at night","Nocturnal animals like snakes have infrared receptors."],["Textbook Q77","Mention life application for ... sea breeze - thermal imaging - convection - electromagnetic waves","Sea breeze moderates weather - Thermal imaging in medicine - Convection in home heating - Electromagnetic in solar heat transfer|None|Conduction only|Cooling only","Various examples: sea breeze, heaters, thermos, solar energy."],["Textbook Q78","Explain: Shiny silver bodies reflect infrared better than dark opaque","Because shiny surface reflects radiation while dark absorbs it|Because shiny absorbs more|No difference|Because dark reflects","Therefore firefighters wear silver shiny clothes to reflect heat."],["Textbook Q79","Ultraviolet rays are responsible for feeling warmth when exposed to sun (True/False)","False - Responsible is infrared rays|True|Partially true|Unrelated","Ultraviolet causes burns and tanning, infrared causes warmth."],["Textbook Q80","Electric heater placed on floor of room to heat air, explain","Because hot air density decreases rises and cold air replaces it creating convection current heating whole room|Because cold air rises|No difference|Because heater heavy","Placing on floor achieves whole heating by convection."],["True/False 81","Infrared rays have chemical effect","True|False - thermal effect only|False - mechanical effect|False - no effect","Has chemical effect on films and thermal effect on skin."],["True/False 82","Hot bodies are source of ultraviolet rays","False - source of infrared rays|True|False - source of light only|False - source of sound","Every hot body radiates infrared, very hot bodies like sun also radiate ultraviolet but main thermal source infrared."],["True/False 83","Idea of wearing
